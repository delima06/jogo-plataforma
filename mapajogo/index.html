<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Expandido - 4 Fases</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }
        canvas {
            display: block;
        }
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: opacity 1s ease-in-out;
            opacity: 0;
            z-index: -1;
        }
        .background.active {
            opacity: 1;
        }
        
        /* CAMINHOS DAS IMAGENS */
        #bg1 { background-image: url('./assets/fase1.png'); }
        #bg2 { background-image: url('./assets/fase2.png'); }
        #bg3 { background-image: url('./assets/fase3.png'); }
        #bg4 { background-image: url('./assets/fase4.png'); }
        
        .ui-info {
            position: fixed;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
            z-index: 100;
            font-family: Arial, sans-serif;
        }
        
        .phase-name {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 28px;
            background: rgba(0,0,0,0.8);
            padding: 20px 40px;
            border-radius: 10px;
            opacity: 0;
            transition: opacity 0.5s ease;
            z-index: 100;
        }
        
        .phase-name.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <!-- Backgrounds das fases -->
    <div id="bg1" class="background active"></div>
    <div id="bg2" class="background"></div>
    <div id="bg3" class="background"></div>
    <div id="bg4" class="background"></div>
    
    <!-- Nome da fase -->
    <div id="phaseName" class="phase-name"></div>
    
    <canvas id="gameCanvas"></canvas>
    
    <div class="ui-info">
        <div>Fase: <span id="currentPhase">1</span> - <span id="phaseNameText">Floresta Inicial</span></div>
        <div>Scroll X: <span id="scrollX">0</span></div>
        <div>Plataformas: <span id="platformCount">0</span></div>
        <div>Progresso: <span id="progress">0%</span></div>
    </div>
    
    <script src="game.js"></script>
    
</body>
</html>
