<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Plataforma</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #000;
        }

        #gameCanvas {
            display: block;
            position: relative;
            z-index: 1;
        }

        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: opacity 1s ease-in-out;
            opacity: 0;
            z-index: 0;
        }

        .background.active {
            opacity: 1;
        }

        #bg1 {
            background-image: url('./assets/fase1.png');
        }

        #bg2 {
            background-image: url('./assets/fase2.png');
        }

        #bg4 {
            background-image: url('./assets/fase4.png');
        }

        .phase-name {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 28px;
            background: rgba(0,0,0,0.8);
            padding: 20px 40px;
            border-radius: 10px;
            opacity: 0;
            transition: opacity 0.5s ease;
            z-index: 100;
            text-align: center;
            pointer-events: none;
        }

        .phase-name.show {
            opacity: 1;
        }

        /* Fallback se as imagens não carregarem */
        #bg1 { background-color: #228B22; }
        #bg2 { background-color: #8B4513; }
        #bg4 { background-color: #2F4F4F; }
    </style>
</head>
<body>
    <!-- Backgrounds PRIMEIRO (z-index mais baixo) -->
    <div id="bg1" class="background active"></div>
    <div id="bg2" class="background"></div>
    <div id="bg4" class="background"></div>
    
    <!-- Canvas DEPOIS (z-index mais alto) -->
    <canvas id="gameCanvas"></canvas>
    
    <!-- Phase name display (z-index mais alto ainda) -->
    <div id="phaseName" class="phase-name"></div>

    <!-- Scripts na ordem correta -->
    <script src="map.js"></script>
    <script src="player.js"></script>
    <script src="enemy.js"></script>
    <script src="game.js"></script>
</body>
</html>
